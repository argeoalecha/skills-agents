<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 100" width="1000" height="100" role="img" aria-label="Southville International School and Colleges">
  <title>Southville International School and Colleges</title>
  <desc>Generated vector lockup for light backgrounds, redrawn to match the real single-line lockup in theme-sisc-logo.png. NOT a trace of the official crest — see theme-sisc-logo.png (real asset), theme-sisc-logo-original.png (source crest) and theme-sisc.BRAND.md.</desc>

  <!-- shield badge -->
  <g transform="translate(4, 4)">
    <path d="M 2 10 L 46 2 L 90 10 L 90 46 C 90 74 68 89 46 92 C 24 89 2 74 2 46 Z" fill="#FFFFFF" stroke="#1E181B" stroke-width="1.4"/>

    <!-- name banner -->
    <path d="M 4 10 L 46 3 L 88 10 L 88 32 L 4 32 Z" fill="#4B2F70" stroke="#1E181B" stroke-width="1.2" stroke-linejoin="round"/>
    <text x="46" y="16.5" text-anchor="middle" font-family="Arial, Arimo, sans-serif" font-size="4.6" font-weight="700" fill="#FFFFFF" letter-spacing="0.2">SOUTHVILLE</text>
    <text x="46" y="22.5" text-anchor="middle" font-family="Arial, Arimo, sans-serif" font-size="4.6" font-weight="700" fill="#FFFFFF" letter-spacing="0.2">INTERNATIONAL SCHOOL</text>
    <text x="46" y="28.5" text-anchor="middle" font-family="Arial, Arimo, sans-serif" font-size="4.6" font-weight="700" fill="#FFFFFF" letter-spacing="0.2">AND COLLEGES</text>

    <!-- quartered diamond -->
    <path d="M 46 38 L 46 66 L 32 52 Z" fill="#4B2F70"/>
    <path d="M 46 38 L 60 52 L 46 66 Z" fill="#8D2725"/>
    <path d="M 32 66 L 46 66 L 60 66 L 46 80 Z" fill="#3C875A"/>
    <circle cx="46" cy="46" r="1.3" fill="#FFFFFF"/>
    <circle cx="40" cy="52" r="1.1" fill="#FFFFFF"/>
    <circle cx="44" cy="58" r="1.1" fill="#FFFFFF"/>
    <circle cx="50" cy="58" r="1.1" fill="#FFFFFF"/>
    <path d="M 55 50.5 c -1.3 -1.5 -3.6 -0.5 -3.6 1.4 c 0 1.8 2.1 3.1 3.6 4.4 c 1.5 -1.3 3.6 -2.6 3.6 -4.4 c 0 -1.9 -2.3 -2.9 -3.6 -1.4 z" fill="#FFFFFF"/>
    <text x="46" y="67" text-anchor="middle" font-family="Arial, sans-serif" font-size="2.1" letter-spacing="0.6" fill="#FFFFFF">FACITE DIFFERENTIAM</text>
    <circle cx="46" cy="74" r="4.4" fill="#60B158" opacity="0.9"/>

    <!-- laurel wreath -->
    <path d="M 22 50 Q 23 72 46 84" fill="none" stroke="#3C875A" stroke-width="2.6" stroke-linecap="round"/>
    <path d="M 70 50 Q 69 72 46 84" fill="none" stroke="#3C875A" stroke-width="2.6" stroke-linecap="round"/>
    <path d="M 24 58 q -5 -2.5 -6.5 -6.5 q 5.5 -0.8 8 3.3 z" fill="#60B158"/>
    <path d="M 28 68 q -5 -2.5 -6.5 -6.5 q 5.5 -0.8 8 3.3 z" fill="#60B158"/>
    <path d="M 34 77 q -5 -2.5 -6.5 -6.5 q 5.5 -0.8 8 3.3 z" fill="#60B158"/>
    <path d="M 68 58 q 5 -2.5 6.5 -6.5 q -5.5 -0.8 -8 3.3 z" fill="#60B158"/>
    <path d="M 64 68 q 5 -2.5 6.5 -6.5 q -5.5 -0.8 -8 3.3 z" fill="#60B158"/>
    <path d="M 58 77 q 5 -2.5 6.5 -6.5 q -5.5 -0.8 -8 3.3 z" fill="#60B158"/>

    <text x="46" y="88.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="6" font-weight="700" fill="#1E181B" letter-spacing="0.2">1990</text>
  </g>

  <!-- single-line wordmark -->
  <text x="120" y="58" font-family="Georgia, Gelasio, 'Times New Roman', serif" font-size="34" font-weight="600" letter-spacing="1.5" fill="#6A3D9E">SOUTHVILLE INTERNATIONAL SCHOOL AND COLLEGES</text>
</svg>
