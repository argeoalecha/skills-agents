<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 470 128" width="470" height="128" role="img" aria-label="Southville International School and Colleges">
  <title>Southville International School and Colleges</title>
  <desc>Generated wordmark lockup for light backgrounds. Simplified shield mark — NOT a vector trace of the official crest. See theme-sisc-logo-original.png and theme-sisc.BRAND.md.</desc>

  <!-- shield mark -->
  <g transform="translate(6, 5)">
    <path d="M 4 12 L 44 4 L 84 12 L 84 60 C 84 90 64 106 44 116 C 24 106 4 90 4 60 Z" fill="#4B2F70"/>
    <path d="M 15 23 L 44 17 L 73 23 L 73 60 C 73 82 58 95 44 101 C 30 95 15 82 15 60 Z" fill="#F4F4F5"/>

    <!-- quartered diamond: violet star canton + maroon heart field -->
    <path d="M 44 34 L 44 66 L 28 50 Z" fill="#4B2F70"/>
    <path d="M 44 34 L 60 50 L 44 66 Z" fill="#8D2725"/>
    <circle cx="36" cy="46" r="1.7" fill="#FFFFFF"/>
    <circle cx="36" cy="54" r="1.7" fill="#FFFFFF"/>
    <circle cx="40" cy="50" r="1.7" fill="#FFFFFF"/>
    <path d="M 52 47.5 c -1.6 -1.8 -4.4 -0.6 -4.4 1.7 c 0 2.2 2.6 3.8 4.4 5.4 c 1.8 -1.6 4.4 -3.2 4.4 -5.4 c 0 -2.3 -2.8 -3.5 -4.4 -1.7 z" fill="#FFFFFF"/>

    <!-- laurel wreath -->
    <path d="M 24 56 Q 25 80 44 93" fill="none" stroke="#3C875A" stroke-width="3.4" stroke-linecap="round"/>
    <path d="M 64 56 Q 63 80 44 93" fill="none" stroke="#3C875A" stroke-width="3.4" stroke-linecap="round"/>
    <path d="M 26 64 q -6 -3 -8 -8 q 7 -1 10 4 z" fill="#60B158"/>
    <path d="M 30 76 q -6 -3 -8 -8 q 7 -1 10 4 z" fill="#60B158"/>
    <path d="M 62 64 q 6 -3 8 -8 q -7 -1 -10 4 z" fill="#60B158"/>
    <path d="M 58 76 q 6 -3 8 -8 q -7 -1 -10 4 z" fill="#60B158"/>

    <text x="44" y="108" text-anchor="middle" font-family="Georgia, Gelasio, 'Times New Roman', serif" font-size="9.5" font-weight="700" fill="#FFFFFF" letter-spacing="0.3">1990</text>
  </g>

  <!-- wordmark -->
  <g transform="translate(108, 0)">
    <text x="0" y="45" font-family="Georgia, Gelasio, 'Times New Roman', serif" font-size="30" font-weight="700" fill="#4B2F70" letter-spacing="0.5">SOUTHVILLE</text>
    <text x="2" y="68" font-family="Arial, Arimo, Helvetica, sans-serif" font-size="13" font-weight="700" fill="#1E181B" letter-spacing="1.9">INTERNATIONAL SCHOOL</text>
    <text x="2" y="86" font-family="Arial, Arimo, Helvetica, sans-serif" font-size="13" font-weight="700" fill="#1E181B" letter-spacing="1.9">AND COLLEGES</text>
    <rect x="2" y="96" width="286" height="3" fill="#6A3D9E"/>
    <text x="2" y="115" font-family="Georgia, Gelasio, 'Times New Roman', serif" font-size="10.5" font-style="italic" fill="#357850" letter-spacing="2.2">FACITE DIFFERENTIAM</text>
  </g>
</svg>
