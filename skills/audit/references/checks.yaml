# Audit check catalog
# Source of truth for every check the audit skill scores.
# The SDLC Structural Plan defines WHAT an audit must cover; this file holds the checks.
# Gate exit criteria = these checks filtered by gate, tier and AI class.
#
# Fields
#   id          G<gate>-<nn>, stable; never renumber, retire by adding `retired: true`
#   gate        G0..G7 (lifecycle gate the check belongs to)
#   pillar      S security | R reliability | E efficiency
#   area        governance | privacy | security | reliability | efficiency | quality | a11y | pipeline | ai
#   min_tier    lowest tier that requires it (T1 < T2 < T3); above project tier -> N/A
#   ai_class    optional; check applies only to AI features of these classes (A1..A4)
#   applies_if  optional; condition that must hold, otherwise N/A
#   critical    true = plan-critical check (named in the plan's "Gap audit checklist")
#   agent       main | security | reliability | efficiency | compliance | quality | ai
#   check       what must be true
#   method      how to verify (read-only)
#   evidence    what to link in the scorecard
#   notes       optional version- or platform-specific detail
#
# Tool commands assume current CLIs: gitleaks v8.19+ (`gitleaks git`), semgrep CE,
# osv-scanner v2, trivy, ZAP baseline via docker image ghcr.io/zaproxy/zaproxy.

checks:

# ───────────────────────── G0 — Governance and foundations ─────────────────────────
- id: G0-01
  gate: G0
  pillar: S
  area: governance
  min_tier: T1
  agent: main
  check: SSO or MFA enforced on every account that can touch the system (GitHub, Vercel, Supabase, GCP, model provider, DNS registrar)
  method: Ask the owner or inspect org security settings; gh api orgs/<org> | jq .two_factor_requirement_enabled
  evidence: Screenshot or settings export per platform, stored in evidence/

- id: G0-02
  gate: G0
  pillar: S
  area: governance
  min_tier: T2
  agent: main
  check: Admin tasks use a separate admin identity protected by a hardware key (solo substitute for separate admins)
  method: Confirm with owner; check GitHub org owners and Vercel/Supabase owner roles list only the admin identity
  evidence: Role listing per platform

- id: G0-03
  gate: G0
  pillar: S
  area: governance
  min_tier: T2
  applies_if: client engagement
  agent: main
  check: Client owns production cloud accounts, domains, repo organization and billing; Hayah-AI works through delegated least-privilege access
  method: Inspect account ownership on GitHub org, Vercel team, Supabase org, GCP billing account, registrar
  evidence: Ownership listing per platform

- id: G0-04
  gate: G0
  pillar: S
  area: privacy
  min_tier: T2
  agent: compliance
  check: Signed data processing (outsourcing) agreement with the client, and a vendor DPA accepted for every processor (Vercel, Supabase, GCP, model provider, Sentry, Better Stack, Langfuse)
  method: Check contract folder and vendor DPA acceptance records
  evidence: Document references (names and dates, not copies)

- id: G0-05
  gate: G0
  pillar: S
  area: governance
  min_tier: T2
  critical: true
  applies_if: client engagement
  agent: main
  check: Client access register exists, lists every holder of access with owner and expiry, and was reviewed at the last gate
  method: Open the register; compare against actual members on GitHub, Vercel, Supabase, GCP
  evidence: Register path plus diff against live membership

- id: G0-06
  gate: G0
  pillar: S
  area: security
  min_tier: T1
  agent: security
  check: Secrets live only in platform stores; .env* files are git-ignored; .env.example holds placeholders only and lists every required variable
  method: git check-ignore .env .env.local; grep .env.example for real-looking values; compare variable names used in code vs .env.example
  evidence: Command output (values redacted)

- id: G0-07
  gate: G0
  pillar: R
  area: reliability
  min_tier: T2
  agent: main
  check: Environments (local, preview, production; staging at T3) defined as code where the platform allows (Terraform/OpenTofu)
  method: Look for infra/ or *.tf; compare with live project settings
  evidence: IaC path

- id: G0-08
  gate: G0
  pillar: E
  area: efficiency
  min_tier: T1
  agent: main
  check: README (setup, env vars, deploy), CLAUDE.md and a definition of done exist and are current
  method: Read files; check they match current scripts and env vars
  evidence: File paths

- id: G0-09
  gate: G0
  pillar: E
  area: efficiency
  min_tier: T1
  agent: main
  check: Billing alerts and spend caps set on every platform, including each AI API key
  method: Inspect billing settings per platform
  evidence: Settings per platform

- id: G0-10
  gate: G0
  pillar: S
  area: ai
  min_tier: T1
  ai_class: [A1, A2, A3, A4]
  agent: compliance
  check: Model-provider terms confirmed in writing for training use, retention and processing region; zero-retention used for client data where offered
  method: Check engagement records for provider terms review
  evidence: Document reference

- id: G0-11
  gate: G0
  pillar: R
  area: reliability
  min_tier: T2
  agent: main
  check: Named on-call owner and incident severity scheme defined; client escalation contact named
  method: Read runbook or contract
  evidence: Document path

# ───────────────────────── G1 — Discovery and requirements ─────────────────────────
- id: G1-01
  gate: G1
  pillar: R
  area: governance
  min_tier: T1
  agent: main
  check: Tier assigned with a one-line rationale; every AI feature assigned a class A1–A4
  method: Look for the Project Profile table in the project CLAUDE.md (written by /project-init), PRD §7, docs/requirements or NFR spec; otherwise record the tier set in this audit's Scope step
