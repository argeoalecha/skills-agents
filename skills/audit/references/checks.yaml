- id: G1-02
  gate: G1
  pillar: R
  area: reliability
  min_tier: T2
  agent: main
  check: NFR spec quantified and signed off — SLOs per critical journey, RPO/RTO, performance budgets, cost ceiling per unit
  method: Read NFR spec; each NFR must have a number and a test
  evidence: Document path and sign-off record

- id: G1-03
  gate: G1
  pillar: S
  area: privacy
  min_tier: T2
  agent: compliance
  check: Data classification, compliance map (RA 10173) and lawful basis recorded for each personal-data flow, including flows into prompts, retrieval and logs
  method: Read data classification and compliance map
  evidence: Document path

- id: G1-04
  gate: G1
  pillar: S
  area: privacy
  min_tier: T2
  agent: compliance
  check: Privacy impact assessment done for personal-data processing; mandatory for every A2–A4 feature and for any data scraping
  method: Read PIA
  evidence: Document path and date
  notes: Scraping PIA requirement per NPC Advisory 2026-01 (13 Apr 2026); AI PIA per NPC Advisory 2024-04

- id: G1-05
  gate: G1
  pillar: E
  area: governance
  min_tier: T2
  applies_if: client engagement
  agent: main
  check: Support terms (warranty window, response times, out-of-scope rates) and AI provider terms (which providers, under whose account, retention) written into the contract
  method: Read contract
  evidence: Clause references

- id: G1-06
  gate: G1
  pillar: R
  area: ai
  min_tier: T1
  ai_class: [A2, A3, A4]
  agent: ai
  check: AI quality thresholds written as NFRs — eval pass rate, latency p95, tokens per request
  method: Read NFR spec or ai/ README
  evidence: Document path

- id: G1-07
  gate: G1
  pillar: S
  area: security
  min_tier: T2
  agent: security
  check: Abuse cases written beside use cases; target OWASP ASVS level chosen
  method: Read requirements
  evidence: Document path

# ───────────────────────── G2 — Architecture and design ─────────────────────────
- id: G2-01
  gate: G2
  pillar: E
  area: efficiency
  min_tier: T2
  agent: main
  check: Architecture diagram in repo showing trust boundaries; ADRs for key decisions (retroactive ADRs accepted on retrofit)
  method: Look for docs/architecture and docs/adr
  evidence: Paths

- id: G2-02
  gate: G2
  pillar: S
  area: security
  min_tier: T2
  agent: security
  check: STRIDE threat model per trust boundary; every high threat has a mitigation or a signed risk acceptance (formal sign-off at T3)
  method: Read threat model; sample three mitigations and confirm they exist in code or config
  evidence: Document path plus sampled file:line

- id: G2-03
  gate: G2
  pillar: S
  area: ai
  min_tier: T1
  ai_class: [A2, A3, A4]
  critical: true
  agent: ai
  check: LLM threat model covers all ten OWASP Top 10 for LLM Applications 2025 risks (plus the OWASP agentic list for A3)
  method: Read the LLM threat model; confirm a row per LLM01–LLM10 with controls and the gate that checks them
  evidence: Document path

- id: G2-04
  gate: G2
  pillar: S
  area: ai
  min_tier: T1
  ai_class: [A3, A4]
  agent: ai
  check: Agent tool controls — tool inventory; tools run with end-user or scoped identity, never service-role or admin keys; read/write tools separated; human approval for irreversible actions; per-session caps on steps, tool calls, tokens and time; sandbox for generated code
  method: Read tool definitions and the code that executes them
  evidence: file:line per control

- id: G2-05
  gate: G2
  pillar: R
  area: reliability
  min_tier: T2
  agent: reliability
  check: Failure-mode analysis on critical paths; timeouts on every outbound call; retries only with idempotency
  method: Read FMEA; grep outbound calls (fetch, SDK clients) for timeouts and retry policy
  evidence: Document path plus file:line samples

- id: G2-06
  gate: G2
  pillar: R
  area: reliability
  min_tier: T2
  agent: main
  check: Backup and restore design meets the G1 RPO/RTO
  method: Compare backup design with RPO/RTO
  evidence: Document path

- id: G2-07
  gate: G2
  pillar: R
  area: reliability
  min_tier: T2
  agent: reliability
  check: API contracts defined (OpenAPI 3.1 or Zod/TypeScript types shared by client and server)
  method: Look for openapi.* or shared schema modules
  evidence: Paths

- id: G2-08
  gate: G2
  pillar: E
  area: efficiency
  min_tier: T1
  critical: true
  agent: main
  check: Function region co-located with the database — Vercel functions pinned to sin1, Supabase in Singapore (ap-southeast-1), Cloud Run in asia-southeast1
  method: vercel.json "regions" or per-function regions; Vercel project settings; supabase projects list (region column); gcloud run services list
  evidence: Config lines and CLI output
  notes: New Vercel projects default to iad1 (Washington, D.C.) unless pinned

- id: G2-09
  gate: G2
  pillar: R
  area: reliability
  min_tier: T1
  agent: main
  check: Cloudflare, if used, is DNS-only in front of Vercel (no proxy)
  method: Check DNS records proxy status; response headers from production must not show cf-ray in front of Vercel
  evidence: DNS export or curl -sI output

# ───────────────────────── G3 — Build (per PR) ─────────────────────────
- id: G3-01
  gate: G3
  pillar: S
  area: security
  min_tier: T1
  critical: true
  agent: security
  check: No secrets anywhere in git history
  method: "gap and gate G5: gitleaks git --log-opts=\"--all\" --redact --report-format json --report-path <report>/evidence/gitleaks.json; gate G3: gitleaks git --log-opts=\"<base>..HEAD\" --redact"
  evidence: Redacted report path
  notes: Any live hit is Critical; tell the owner to rotate immediately and record only that rotation happened

- id: G3-02
  gate: G3
  pillar: S
  area: security
  min_tier: T1
  critical: true
  agent: security
  check: No secret keys reach the browser — no Supabase service_role or sb_secret_ keys, model-provider keys (sk-ant-, sk-), or other secrets in client components or NEXT_PUBLIC_* variables, and none in the built client bundle
  method: grep client code and NEXT_PUBLIC_ names; after build, scan .next/static (or dist/) for key patterns and JWT-shaped strings (eyJ...) whose payload role is service_role
  evidence: Command output (values redacted)

- id: G3-03
  gate: G3
  pillar: S
  area: security
  min_tier: T1
  agent: security
  check: No hardcoded credentials or production URLs that should be environment variables
  method: semgrep secrets and hardcoded-URL rules; grep for passwords, Bearer tokens, api keys
  evidence: Findings list (redacted)

- id: G3-04
  gate: G3
  pillar: S
  area: security
  min_tier: T1
  agent: security
  check: SAST clean — no new ERROR-severity Semgrep CE findings; existing findings recorded as a baseline
  method: semgrep scan --config p/default --config p/nextjs --config p/typescript (plus p/python for services) --sarif -o <report>/evidence/semgrep.sarif; gate G3 uses --baseline-commit <base>
  evidence: SARIF path

- id: G3-05
  gate: G3
  pillar: S
  area: security
  min_tier: T1
  agent: security
  check: No known-vulnerable dependencies newly introduced; existing high/critical within patch SLA
  method: osv-scanner scan source -r . --format json --output <report>/evidence/osv.json (T1 may use npm audit --audit-level=high)
  evidence: Report path

- id: G3-06
  gate: G3
  pillar: S
  area: security
  min_tier: T1
  agent: security
  check: No injection paths — parameterized SQL, no unsanitized dangerouslySetInnerHTML, no eval/Function/dynamic import of user input, no SSRF, open redirect or path traversal in URL and file handling
  method: Semgrep results plus manual review of every raw SQL, fetch(userUrl), redirect and fs call
  evidence: file:line per finding

- id: G3-07
  gate: G3
  pillar: S
  area: security
  min_tier: T1
  agent: security
  check: Every protected route, API route and server action enforces authentication and authorization server-side; webhooks verify signatures; mutating endpoints are CSRF-safe
  method: Enumerate app/**/route.ts, server actions and proxy.ts; confirm auth check per handler
  evidence: Route table with auth status

- id: G3-08
  gate: G3
  pillar: S
  area: security
  min_tier: T1
  critical: true
  applies_if: Supabase or another Postgres exposed through PostgREST
  agent: security
  check: RLS enabled on every table in every exposed schema; no permissive policy (using/with check true) on user data; views in exposed schemas use security_invoker; RLS policy tests run in CI
  method: |
    Read-only SQL against the target (preview branch in gate modes, production read replica or read-only role in gap mode):
      select n.nspname, c.relname from pg_class c join pg_namespace n on n.oid = c.relnamespace
      where c.relkind in ('r','p') and n.nspname = any('{public}') and not c.relrowsecurity;
      select schemaname, tablename, policyname from pg_policies where qual = 'true' or with_check = 'true';
      select n.nspname, c.relname from pg_class c join pg_namespace n on n.oid = c.relnamespace
      where c.relkind = 'v' and n.nspname = 'public' and not coalesce('security_invoker=true' = any(c.reloptions), false);
    Add every schema listed in the project's exposed-schemas setting. Also run the Supabase security advisor (Supabase MCP get_advisors, type security).
  evidence: Query output and advisor output
  notes: RLS enabled with no policy denies all — that is safe; flag only exposure

- id: G3-09
  gate: G3
  pillar: R
  area: reliability
  min_tier: T1
  agent: reliability
  check: Lockfile committed and installs are frozen (npm ci, pnpm --frozen-lockfile, uv sync --locked)
  method: ls package-lock.json pnpm-lock.yaml yarn.lock bun.lock bun.lockb uv.lock poetry.lock; read CI install steps
  evidence: Lockfile path and CI line

- id: G3-10
  gate: G3
  pillar: S
  area: security
  min_tier: T2
  agent: main
  check: Commits on main are signed
  method: git log --format='%G? %h' -n 50 main
  evidence: Command output

- id: G3-11
  gate: G3
  pillar: S
  area: ai
  min_tier: T1
  ai_class: [A1, A2, A3, A4]
  agent: ai
  check: Prompts, model IDs and parameters versioned in the repo; no secrets or authorization logic in system prompts (LLM07)
  method: Locate prompt files and model config; grep prompts for keys and for permission rules that should be enforced in code
  evidence: Paths

- id: G3-12
  gate: G3
  pillar: S
  area: ai
  min_tier: T1
  ai_class: [A2, A3, A4]
  agent: ai
  check: Untrusted input and retrieved content kept separate from instructions (LLM01); structured outputs schema-validated (Zod/Pydantic); model output never executed or rendered unescaped; generated SQL runs read-only and parameterized (LLM05)
  method: Trace each model call from input assembly to output use
  evidence: file:line per call site

- id: G3-13
  gate: G3
  pillar: R
  area: ai
  min_tier: T1
  ai_class: [A1, A2, A3, A4]
  agent: ai
  check: Model IDs pinned and not deprecated or retired; AI SDK versions pinned
  method: List model IDs in code/config; check against the provider's current model and deprecation pages (web search)
  evidence: Model ID list with status and date checked

- id: G3-14
  gate: G3
  pillar: S
  area: ai
  min_tier: T2
  ai_class: [A2, A3, A4]
  agent: compliance
  check: Personal data redacted or pseudonymized before model calls wherever the task allows; retrieval filtered by the caller's permissions (LLM02, LLM08)
  method: Inspect prompt assembly and retrieval queries; confirm vector tables have RLS
  evidence: file:line

- id: G3-15
  gate: G3
  pillar: S
  area: ai
  min_tier: T1
  ai_class: [A3, A4]
  agent: ai
  check: Third-party MCP servers and plugins vetted and version-pinned; their output treated as untrusted input (LLM03)
  method: List MCP/plugin dependencies and how output is consumed
  evidence: Inventory

- id: G3-20
  gate: G3
  pillar: R
  area: reliability
  min_tier: T1
  agent: reliability
  check: Unit and contract tests pass; coverage on changed lines meets the threshold (default 80%)
  method: npx vitest run --coverage (or npm test); pytest --cov for services
  evidence: Test summary

- id: G3-21
  gate: G3
  pillar: R
  area: reliability
  min_tier: T1
  agent: reliability
  check: Errors handled at boundaries — no unhandled promise rejections, null guards on external data, React error boundaries plus loading and error states, .single() or equivalent for single-row reads, listeners and intervals cleaned up
  method: Code review of data boundaries and app/**/error.tsx, loading.tsx
  evidence: file:line per finding

- id: G3-22
  gate: G3
  pillar: R
  area: reliability
  min_tier: T2
  agent: reliability
  check: Side-effecting POSTs are idempotent (payments, email, writes); multi-step writes use a transaction or RPC; no race conditions on concurrent updates
  method: Review mutating handlers and server actions
  evidence: file:line per finding

- id: G3-23
  gate: G3
  pillar: R
  area: reliability
  min_tier: T1
  agent: reliability
  check: Migrations are forward-only and expand/contract — applied migrations never edited; drops, renames and type changes only in a contract release with a same-day backup and a PR callout; RLS changes in their own migration with tests; all migrations apply from scratch
  method: git log --diff-filter=M -- supabase/migrations (edits to applied files); grep new migrations for drop/rename/alter type; supabase db reset locally or in CI
  evidence: Command output
  notes: Rollback means redeploying the previous app; schema rolls forward, not back

- id: G3-24
  gate: G3
  pillar: R
  area: reliability
  min_tier: T2
  agent: reliability
  check: Structured logs on API routes with request id, user id and duration, and no personal data in log lines
  method: Inspect logger setup and sample handlers
  evidence: file:line

- id: G3-25
  gate: G3
  pillar: R
  area: ai
  min_tier: T1
  ai_class: [A1, A2, A3, A4]
  agent: ai
  check: Model-call failures handled — timeouts, retries with backoff, parse-failure recovery, fallback or escalation; agent loops have max iterations and max tokens
  method: Review every model and tool call site
  evidence: file:line per call site

- id: G3-26
  gate: G3
  pillar: R
  area: reliability
  min_tier: T3
  agent: reliability
  check: Risky features ship behind feature flags
  method: Look for flag provider (PostHog, Unleash) and flag checks around new features
  evidence: file:line

- id: G3-30
  gate: G3
  pillar: E
  area: efficiency
  min_tier: T1
  agent: main
  check: Build is clean — tsc --noEmit with zero errors, ESLint (flat config) with zero errors, Prettier check, production build succeeds; Ruff and pytest for Python services
  method: npx tsc --noEmit; npx eslint .; npx prettier --check .; npm run build; ruff check services/
  evidence: Command summaries
  notes: Lint errors fail, warnings are reported only (pipeline spec). ESLint 10 requires flat config and Node ^20.19 || ^22.13 || >=24.

- id: G3-31
  gate: G3
  pillar: E
  area: efficiency
  min_tier: T2
  applies_if: web app
  agent: efficiency
  check: Bundle within the G1 performance budgets, or the defaults when none were set (largest chunk under 150 KB marketing / 250 KB app; First Load JS per route under 200 KB)
  method: Read the build output table; apply ~/.claude/skills/web-perf-audit/references/local-build-audit.md if present
  evidence: Build table excerpt

- id: G3-32
  gate: G3
  pillar: E
  area: efficiency
  min_tier: T2
  agent: efficiency
  check: No N+1 queries, missing indexes on common filters, unpaginated list endpoints, event-loop-blocking work or uncached expensive routes
  method: Review data-access code; check indexes against where/order-by columns; Supabase performance advisor
  evidence: file:line per finding

- id: G3-33
  gate: G3
  pillar: E
  area: efficiency
  min_tier: T2
  applies_if: web app
  agent: efficiency
  check: Rendering efficiency — next/image for images; manual memoization on expensive computations unless reactCompiler is enabled in next.config
  method: Grep <img; read next.config for reactCompiler
  evidence: file:line

- id: G3-34
  gate: G3
  pillar: E
  area: ai
  min_tier: T2
  ai_class: [A1, A2, A3, A4]
  agent: efficiency
  check: Prompt caching on long repeated prompts; batch API where latency allows; token usage logged per call
  method: Inspect model client configuration
  evidence: file:line

- id: G3-35
  gate: G3
  pillar: R
  area: reliability
  min_tier: T1
  applies_if: Next.js app
  agent: main
  check: Framework currency — Next.js 16 projects use proxy.ts (middleware.ts deprecated; proxy runs on Node.js only), Turbopack default reviewed for custom webpack config, Node version on CI meets framework and ESLint floors
  method: Read package.json, next.config, root files, CI node-version
  evidence: File lines

- id: G3-40
  gate: G3
  pillar: E
  area: quality
  min_tier: T1
  agent: quality
  check: Code hygiene — no console.log, debugger or eslint-disable in production paths; TODO/FIXME/HACK listed; no TypeScript any; no files over 500 lines without clear structure; no functions over complexity 15; no dead exports; no unexplained magic numbers
  method: grep and ESLint complexity rules; knip or ts-prune for dead exports
  evidence: Counts plus file:line list

- id: G3-41
  gate: G3
  pillar: E
  area: a11y
  min_tier: T2
  applies_if: web app
  agent: quality
  check: WCAG 2.2 AA at code level — keyboard support, labelled icon buttons and inputs, alt text, contrast 4.5:1 / 3:1, visible focus, semantic elements, skip link, focus management on route change and modals, 24×24 targets (2.5.8), focus not obscured (2.4.11), drag alternatives (2.5.7), accessible authentication (3.3.8)
  method: Code review plus axe on preview if available
  evidence: file:line per finding
  notes: Flow-level UX and SEO belong to /ux-review

- id: G3-50
  gate: G3
  pillar: S
  area: privacy
  min_tier: T2
  applies_if: collects personal data
  agent: compliance
  check: Consent captured where consent is the lawful basis; privacy notice linked from auth and landing pages; AI involvement, purpose and extent disclosed and AI output labelled
  method: Inspect signup and public forms, footer, AI UI
  evidence: file:line and route list
  notes: AI transparency per NPC Advisory 2024-04

- id: G3-51
  gate: G3
  pillar: S
  area: privacy
  min_tier: T2
  agent: compliance
  check: No personal data in logs, error reports or analytics; IPs anonymized; no full IPs stored
  method: grep log calls for user fields; inspect Sentry beforeSend / sendDefaultPii; inspect analytics config and tables
  evidence: file:line

- id: G3-52
  gate: G3
  pillar: S
  area: privacy
  min_tier: T2
  applies_if: collects personal data
  agent: compliance
  check: Data subject rights implemented — access and export in a structured format (RA 10173 §16, §18 portability), correction, erasure or blocking (§16(e)) — and erasure reaches embeddings, traces, logs and eval sets
  method: Find export and deletion endpoints or admin procedures; trace deletion across stores
  evidence: Endpoint list and deletion trace

- id: G3-53
  gate: G3
  pillar: S
  area: privacy
  min_tier: T2
  applies_if: collects personal data
  agent: compliance
  check: Retention periods stated and enforced by a purge job or policy
  method: Read privacy notice retention; find scheduled purge
  evidence: Paths

- id: G3-54
  gate: G3
  pillar: S
  area: privacy
  min_tier: T2
  applies_if: stores sensitive personal information
