# ───────────────────────── G5 — Release and deploy ─────────────────────────
- id: G5-01
  gate: G5
  pillar: S
  area: pipeline
  min_tier: T2
  critical: true
  agent: main
  check: Production changes only through the pipeline — release.yml builds once and deploys the prebuilt output (vercel deploy --prebuilt); Vercel git auto-deploys to production disabled; GitHub production environment restricted to main with environment-scoped secrets; no manual production deploys in history; Cloud Run deployed by digest via OIDC
  method: Read release.yml and vercel.json (git.deploymentEnabled); gh api repos/<o>/<r>/environments/production; vercel ls --prod and check each deployment's source; gcloud run revisions list
  evidence: Config lines plus deployment list
  notes: T1 allows manual deploys; score N/A below T2

- id: G5-02
  gate: G5
  pillar: R
  area: reliability
  min_tier: T2
  agent: main
  check: Health endpoint returns 200 and reports the deployed commit SHA; release verify step fails on mismatch
  method: curl -s <prod>/api/health; read release.yml verify job
  evidence: Response (no secrets) and job lines

- id: G5-03
  gate: G5
  pillar: R
  area: reliability
  min_tier: T2
  agent: main
  check: Post-deploy smoke tests run on production and a failure triggers automatic rollback (vercel rollback, Cloud Run previous revision); rollback verified at least once
  method: Read release.yml smoke and rollback jobs; find a rollback rehearsal record
  evidence: Job lines and record

- id: G5-04
  gate: G5
  pillar: S
  area: security
  min_tier: T2
